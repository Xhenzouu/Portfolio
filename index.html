<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Static fallback values for SEO; renderMeta() overwrites both from
       data.meta.* at runtime. Keeping real values here means crawlers and
       a no-JS render both see the correct identity. -->
  <title>Portfolio — Henson Brix A. Arroyo</title>
  <meta name="description" content="Portfolio of Henson Brix A. Arroyo — Full-Stack Developer & Aspiring Tech Support Professional" />
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />

  <!-- Theme flash-prevention: read saved theme before first paint -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('portfolio-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) { /* localStorage unavailable — default theme stands */ }
    })();
  </script>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/utilities.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- ============================================================
       DESKTOP / WEB SHELL — Windows File Explorer style
       Hidden on narrow viewports via layout.css breakpoints.
       ============================================================ -->
  <div class="explorer-shell" id="explorer-shell">

    <!-- Sidebar: flat section list -->
    <aside class="explorer-sidebar" id="explorer-sidebar" aria-label="Folder navigation">
      <div class="sidebar-header">
        <span class="brand-mark" data-icon="layout-grid" aria-hidden="true">▣</span>
        <!-- Populated by the render pipeline from data.meta.name -->
        <span class="brand-name"></span>
      </div>

      <nav aria-label="Portfolio sections">
        <ul class="folder-tree" role="tree" id="folder-tree">
          <!-- Section rows are rendered by the render pipeline -->
        </ul>
      </nav>

      <div class="sidebar-footer">
        <button type="button" class="theme-toggle" id="theme-toggle-desktop" aria-pressed="false">
          <span class="theme-toggle__icon" data-icon="sun" aria-hidden="true"></span>
          <span class="theme-toggle__label">Toggle theme</span>
        </button>
      </div>
    </aside>

    <!-- Top toolbar: breadcrumb + search + view toggle -->
    <header class="explorer-toolbar" id="explorer-toolbar">
      <button type="button" class="icon-button sidebar-collapse-btn" id="sidebar-collapse-btn" aria-label="Collapse sidebar" aria-expanded="true" aria-controls="explorer-sidebar">
        <span data-icon="menu" aria-hidden="true"></span>
      </button>

      <nav aria-label="breadcrumb" class="breadcrumb" id="breadcrumb">
        <ol class="breadcrumb__list">
          <!-- Breadcrumb items are rendered by the render pipeline -->
        </ol>
      </nav>

      <div class="toolbar-search">
        <label class="visually-hidden" for="search-input">Search portfolio</label>
        <span class="toolbar-search__icon" data-icon="search" aria-hidden="true"></span>
        <input type="search" id="search-input" class="toolbar-search__input" placeholder="Search projects, skills, certifications…" autocomplete="off" />
      </div>

      <div class="toolbar-actions" role="group" aria-label="View options">
        <button type="button" class="icon-button view-toggle" id="view-toggle-grid" aria-pressed="true" aria-label="Grid view">
          <span data-icon="layout-grid" aria-hidden="true"></span>
        </button>
        <button type="button" class="icon-button view-toggle" id="view-toggle-list" aria-pressed="false" aria-label="List view">
          <span data-icon="list" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <!-- Main body: dashboard content -->
    <main class="explorer-main" id="main-content" tabindex="-1">
      <section class="dashboard-section" aria-labelledby="dashboard-heading">
        <div class="dashboard-section__header">
          <h1 id="dashboard-heading">Projects</h1>
          <p class="dashboard-section__subtitle">[Placeholder subtitle — e.g. "12 projects across 4 categories"]</p>
          <div class="dashboard-filters" id="dashboard-filters" role="tablist" aria-label="Filter by category">
            <!-- Chips are rendered by the render pipeline -->
          </div>
        </div>

        <div class="dashboard-grid" id="dashboard-grid" role="list">
          <!-- Cards are rendered by the render pipeline -->
        </div>
      </section>
    </main>
  </div>

  <!-- ============================================================
       MOBILE SHELL — Google Drive app style
       Hidden on wide viewports via layout.css breakpoints.
       ============================================================ -->
  <div class="drive-shell" id="drive-shell" hidden>

    <header class="drive-topbar">
      <button type="button" class="icon-button" id="drawer-open-btn" aria-label="Open menu" aria-expanded="false" aria-controls="drive-drawer">
        <span data-icon="menu" aria-hidden="true"></span>
      </button>

      <div class="drive-topbar__search">
        <label class="visually-hidden" for="mobile-search-input">Search portfolio</label>
        <span data-icon="search" aria-hidden="true"></span>
        <input type="search" id="mobile-search-input" placeholder="Search" autocomplete="off" />
      </div>

      <button type="button" class="avatar-button" aria-label="Profile">
        <span class="avatar-button__initials" aria-hidden="true"></span>
      </button>
    </header>

    <nav class="drive-tabs" aria-label="Content type">
      <!-- Tabs are rendered by the render pipeline -->
    </nav>

    <main class="drive-main" tabindex="-1">
      <div class="drive-filters" id="drive-filters" role="tablist" aria-label="Filter by category">
        <!-- Chips are rendered by the render pipeline -->
      </div>
      <div class="drive-grid" id="drive-grid" role="list">
        <!-- Cards are rendered by the render pipeline -->
      </div>
    </main>

    <button type="button" class="fab" id="fab-button" aria-label="Quick actions">
      <span data-icon="plus" aria-hidden="true"></span>
    </button>

    <nav class="drive-bottom-nav" aria-label="Primary">
      <button type="button" class="drive-bottom-nav__item is-active" aria-current="page">
        <span class="drive-bottom-nav__icon" data-icon="home" aria-hidden="true"></span>
        <span class="drive-bottom-nav__label">Home</span>
      </button>
      <button type="button" class="drive-bottom-nav__item">
        <span class="drive-bottom-nav__icon" data-icon="star" aria-hidden="true"></span>
        <span class="drive-bottom-nav__label">Starred</span>
      </button>
      <button type="button" class="drive-bottom-nav__item">
        <span class="drive-bottom-nav__icon" data-icon="share-2" aria-hidden="true"></span>
        <span class="drive-bottom-nav__label">Shared</span>
      </button>
      <button type="button" class="drive-bottom-nav__item">
        <span class="drive-bottom-nav__icon" data-icon="file" aria-hidden="true"></span>
        <span class="drive-bottom-nav__label">Files</span>
      </button>
    </nav>

    <!-- Drawer menu (off-canvas) -->
    <div class="drive-drawer" id="drive-drawer" hidden>
      <div class="drive-drawer__backdrop" id="drive-drawer-backdrop"></div>
      <nav class="drive-drawer__panel" aria-label="Menu">
        <div class="drive-drawer__header">
          <span class="avatar-button__initials" aria-hidden="true"></span>
          <span class="drive-drawer__name"></span>
        </div>
        <ul class="drive-drawer__list">
          <!-- Drawer links are rendered by the render pipeline -->
        </ul>
        <div class="drive-drawer__footer">
          <button type="button" class="theme-toggle" id="theme-toggle-mobile" aria-pressed="false">
            <span class="theme-toggle__icon" data-icon="sun" aria-hidden="true"></span>
            <span class="theme-toggle__label">Toggle theme</span>
          </button>
        </div>
      </nav>
    </div>
  </div>

  <!-- ============================================================
       CARD DETAIL MODAL (shared by both shells)
       Static shell; content is built by render.renderModalContent(item)
       and the open/close/focus-trap is handled by interactions/*.
       ============================================================ -->
  <div class="modal" id="card-modal" hidden>
    <div class="modal__backdrop" data-modal-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="icon-button modal__close" data-modal-close aria-label="Close details">
        <span data-icon="x" aria-hidden="true"></span>
      </button>
      <div class="modal__content" id="modal-content">
        <!-- Populated by render.renderModalContent(item) -->
      </div>
    </div>
  </div>

  <!-- ============================================================
       IMAGE LIGHTBOX (click-to-zoom for slideshow images)
       Sibling of the modal so it renders on top when open. Static shell;
       the image src/alt are set by interactions/_modal.js on open.
       ============================================================ -->
  <div class="lightbox" id="image-lightbox" hidden>
    <div class="lightbox__backdrop" data-lightbox-close></div>
    <div class="lightbox__panel">
      <button type="button" class="lightbox__close" data-lightbox-close aria-label="Close zoomed image">
        <span data-icon="x" aria-hidden="true"></span>
      </button>
      <img class="lightbox__image" src="" alt="" />
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>

  <!-- Render pipeline — partials, then the barrel. The barrel calls
       window.render.renderAll() after every partial has loaded. -->
  <script src="js/render/_shell.js"></script>
  <script src="js/render/_cards.js"></script>
  <script src="js/render/_chips.js"></script>
  <script src="js/render/_sections.js"></script>
  <script src="js/render/_modal.js"></script>
  <script src="js/render/_drawer.js"></script>
  <script src="js/render/_bootstrap.js"></script>
  <script src="js/render/index.js"></script>

  <!-- Interactions pipeline — partials, then the barrel. The barrel
       calls window.interactions.init() after every partial has loaded. -->
  <script src="js/interactions/_nav.js"></script>
  <script src="js/interactions/_theme.js"></script>
  <script src="js/interactions/_view.js"></script>
  <script src="js/interactions/_search.js"></script>
  <script src="js/interactions/_chips.js"></script>
  <script src="js/interactions/_drawer.js"></script>
  <script src="js/interactions/_modal.js"></script>
  <script src="js/interactions/_sidebar.js"></script>
  <script src="js/interactions/_bootstrap.js"></script>
  <script src="js/interactions/index.js"></script>

  <script src="js/init.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
